server:
  port: 8080

spring:
  application:
    name: dsh-platform
  config:
    import:
      - optional:classpath:application-local.yml
      - optional:file:./application-local.yml
      - optional:file:./backend/application-local.yml
  datasource:
    url: jdbc:mysql://localhost:3306/dsh_platform?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: root123
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: localhost
      port: 6381
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 8MB

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    # 开发时如需打印 SQL，在 application-local.yml 中设置 log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
      id-type: auto

# 自定义配置
dsh:
  cors:
    # 允许的前端来源（支持通配）。默认仅本机与内网；生产环境请覆盖为真实域名
    origins: ${DSH_CORS_ORIGINS:http://localhost:*,http://127.0.0.1:*,http://192.168.*:*,http://10.*:*}
  jwt:
    # 必填，≥32 字节随机串。未配置时应用拒绝启动。放在 application-local.yml 或环境变量里，不要提交到仓库
    secret: ${DSH_JWT_SECRET:}
    expire-hours: 24
  fee:
    intention-fixed: 1000      # 意向金固定金额
    intention-rate: 0.001      # 意向金比例（已弃用，改走固定金额）
    deposit-rate: 0.05         # 工厂保证金比例 5%（按总报价）
    buyer-deposit-rate: 0.05   # 买家保证金比例 5%（按预估总价）
    commission-rate: 0.01      # 佣金费率 1%
    cancel-forfeit-rate: 0.5   # 买家反悔扣意向金比例 50%
  credit:
    survey-weight: 0.4
    complete-weight: 0.3
    pass-weight: 0.3
  time:
    factory-thinking-hours: 24 # 工厂思考期：决定是否参加并填报方案
    buyer-thinking-hours: 24   # 买家思考期：决定是否继续并交保证金
    thinking-hours: 24         # 旧流程思考期（兼容历史数据）
    review-hours: 6            # 旧流程审核期
    locking-hours: 48          # 旧流程保证金期
    contract-sign-hours: 24    # 签约期：双方签署合同时限
    contract-issue-hours: 48   # 合同发布期：买家上传合同文件时限
  upload:
    dir: uploads
  ai:
    provider: deepseek
    model: ${DSH_AI_MODEL:deepseek-chat}
    base-url: https://api.deepseek.com
  pay:
    alipay:
      enabled: false
      app-id: ${DSH_ALIPAY_APP_ID:}
      gateway: https://openapi-sandbox.dl.alipaydev.com/gateway.do
      notify-url: ${DSH_ALIPAY_NOTIFY_URL:}
      return-url: http://localhost:5173/buyer/orders
      factory-return-url: http://localhost:5173/factory/quotations

logging:
  level:
    com.dsh: info
